<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Geladinho" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Ícones -->
    <link
      rel="apple-touch-icon"
      href="https://img.icons8.com/color/512/ice-pop.png"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍧</text></svg>"
    />

    <!-- Fonte do Sistema (San Francisco para iOS) e Ícones Phosphor -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <title>Geladinho App</title>

    <style>
      /* ============================================================
       VARIÁVEIS E RESET
       ============================================================ */
      :root {
        --primary: #ff4b6b;
        --primary-gradient: linear-gradient(135deg, #ff6b6b, #ff4b6b);
        --secondary: #00d2d3;
        --bg-color: #f8f9fa;
        --glass-bg: rgba(255, 255, 255, 0.65);
        --glass-border: rgba(255, 255, 255, 0.8);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        --text-main: #1c1c1e;
        --text-muted: #8e8e93;
        --success: #34c759;
        --danger: #ff3b30;
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 10px;
        --nav-height: 80px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100dvh;
        padding-bottom: calc(
          var(--nav-height) + 20px + env(safe-area-inset-bottom)
        );
        overflow-x: hidden;
        /* Fundo animado para destacar o efeito vidro */
        background: linear-gradient(45deg, #ffe2e2, #e2f9ff, #fff5e2, #f2e2ff);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Bolhas de luz para dar profundidade ao vidro */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        z-index: -1;
        opacity: 0.6;
      }
      .orb-1 {
        top: -10%;
        left: -10%;
        width: 300px;
        height: 300px;
        background: #ff9a9e;
      }
      .orb-2 {
        bottom: 10%;
        right: -10%;
        width: 250px;
        height: 250px;
        background: #a18cd1;
      }
      .orb-3 {
        top: 40%;
        left: 60%;
        width: 200px;
        height: 200px;
        background: #fad0c4;
      }

      /* ============================================================
       GLASSMORPHISM UTILITIES
       ============================================================ */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        border-radius: var(--radius-lg);
      }

      /* ============================================================
       HEADER E LAYOUT
       ============================================================ */
      header {
        padding: 20px 24px;
        padding-top: calc(
          40px + env(safe-area-inset-top)
        ); /* Aumentei o espaço no topo */
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      header h1 {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      main {
        padding: 0 20px;
        max-width: 800px;
        margin: 0 auto;
        animation: fadeIn 0.4s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      /* ============================================================
       BOTTOM NAVIGATION (Estilo iOS Flutuante)
       ============================================================ */
      .bottom-nav {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 40px);
        max-width: 500px;
        height: var(--nav-height);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 100;
        padding: 0 10px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        border-radius: 40px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 0.7rem;
        font-weight: 500;
        padding: 10px;
        border-radius: 20px;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        cursor: pointer;
        width: 70px;
      }

      .nav-item i {
        font-size: 1.6rem;
        transition: transform 0.3s;
      }

      .nav-item.active {
        color: var(--primary);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 12px rgba(255, 75, 107, 0.15);
      }
      .nav-item.active i {
        transform: translateY(-2px);
      }

      /* ============================================================
       CARDS E LISTAS
       ============================================================ */
      .card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: var(--glass-shadow);
        transition: transform 0.2s;
      }

      .card h3 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      .list-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .list-item:first-child {
        padding-top: 0;
      }

      .item-info {
        flex: 1;
      }
      .item-title {
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 4px;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .item-sub {
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.4;
      }
      .item-actions {
        display: flex;
        gap: 8px;
      }

      /* Badges */
      .badge {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .badge-pago {
        background: rgba(52, 199, 89, 0.15);
        color: var(--success);
      }
      .badge-pendente {
        background: rgba(255, 59, 48, 0.15);
        color: var(--danger);
      }

      /* ============================================================
       BOTÕES E INPUTS
       ============================================================ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        border-radius: var(--radius-md);
        border: none;
        font-size: 0.95rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: none; /* Sombra removida de todos os botões */
      }
      .btn:active {
        transform: scale(0.96);
      }

      .btn-primary {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 4px 15px rgba(255, 75, 107, 0.3);
      }
      .btn-outline {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(0, 0, 0, 0.1);
        color: var(--text-main);
        box-shadow: none; /* Remove a sombra padrão */
      }
      .btn-icon {
        padding: 10px;
        border-radius: 50%;
        aspect-ratio: 1;
      }
      .btn-sm {
        padding: 8px 12px;
        font-size: 0.85rem;
        border-radius: var(--radius-sm);
      }

      /* Estilo para o botão de filtro ativo */
      .filtro-status.active {
        background: var(--primary) !important;
        color: white !important;
        border-color: var(--primary) !important;
        box-shadow: none !important;
      }

      input,
      select {
        width: 100%;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: rgba(255, 255, 255, 0.6);
        font-size: 1rem;
        font-family: inherit;
        color: var(--text-main);
        outline: none;
        transition: all 0.2s;
        -webkit-appearance: none;
      }
      input:focus,
      select:focus {
        background: #fff;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(255, 75, 107, 0.1);
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        margin: 12px 0 6px;
      }

      /* ============================================================
       SUMMARY CARDS (Relatórios)
       ============================================================ */
      .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 20px;
      }
      .summary-card {
        padding: 16px;
        text-align: center;
        border-radius: var(--radius-lg);
      }
      .summary-card .label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        font-weight: 600;
        margin-bottom: 8px;
      }
      .summary-card .value {
        font-size: 1.3rem;
        font-weight: 700;
      }
      .value-green {
        color: var(--success);
      }
      .value-red {
        color: var(--danger);
      }
      .value-blue {
        color: #007aff;
      }

      /* ============================================================
       MODAL BOTTOM SHEET (Estilo iOS)
       ============================================================ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: 1000;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .modal {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        width: 100%;
        max-width: 600px;
        border-radius: 30px 30px 0 0;
        padding: 24px;
        transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        max-height: 90dvh;
        overflow-y: auto;
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
      }
      .modal-overlay.show .modal {
        transform: translateY(0);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .modal-header h2 {
        font-size: 1.2rem;
        font-weight: 700;
      }
      .close-btn {
        background: rgba(0, 0, 0, 0.05);
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        color: var(--text-muted);
        cursor: pointer;
        transition: 0.2s;
      }
      .close-btn:hover {
        background: rgba(0, 0, 0, 0.1);
      }

      /* ============================================================
       ITENS DO PEDIDO
       ============================================================ */
      .item-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        align-items: center;
      }
      .item-row select {
        flex: 2;
        padding: 12px;
      }
      .item-row input {
        flex: 1;
        padding: 12px;
        text-align: center;
      }
      .total-display {
        text-align: right;
        font-size: 1.4rem;
        font-weight: 700;
        margin: 20px 0;
        color: var(--primary);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 75, 107, 0.1);
        padding: 16px;
        border-radius: var(--radius-md);
      }

      /* ============================================================
       TOAST NOTIFICATIONS
       ============================================================ */
      #toast-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
      }
      .toast {
        background: rgba(30, 30, 30, 0.9);
        color: white;
        padding: 12px 20px;
        border-radius: 30px;
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        animation: toastIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        backdrop-filter: blur(10px);
      }
      .toast.error {
        background: rgba(255, 59, 48, 0.9);
      }
      .toast.success {
        background: rgba(52, 199, 89, 0.9);
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(-20px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateY(-20px) scale(0.9);
        }
      }

      /* Utilitários */
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
        font-size: 0.9rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .empty-state i {
        font-size: 3rem;
        opacity: 0.3;
      }
      .flex-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .mt-4 {
        margin-top: 16px;
      }
      .mb-4 {
        margin-bottom: 16px;
      }

      /* Ajustes Mobile */
      @media (min-width: 600px) {
        .summary-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        main {
          padding-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Bolhas de fundo do Glassmorphism -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div id="toast-container"></div>

    <header>
      <h1>🍧 Geladinho App</h1>
    </header>

    <main>
      <!-- ABA PEDIDOS -->
      <section id="tab-pedidos" class="tab-content active">
        <button
          class="btn btn-primary"
          id="btnNovoPedido"
          style="width: 100%; margin-bottom: 20px; padding: 16px"
        >
          <i class="ph ph-plus-circle" style="font-size: 1.2rem"></i> Novo
          Pedido
        </button>

        <div
          style="
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
          "
        >
          <button
            class="btn btn-sm btn-outline filtro-status"
            data-status="todos"
          >
            Todos
          </button>
          <button
            class="btn btn-sm btn-outline filtro-status active"
            data-status="pendente"
          >
            Pendentes
          </button>
          <button
            class="btn btn-sm btn-outline filtro-status"
            data-status="pago"
          >
            Pagos
          </button>
        </div>

        <div id="listaPedidos">
          <div class="card empty-state">
            <i class="ph ph-spinner-gap ph-spin"></i> Carregando pedidos...
          </div>
        </div>
      </section>

      <!-- ABA CLIENTES -->
      <section id="tab-clientes" class="tab-content">
        <div class="card">
          <h3>
            <i class="ph ph-user-plus" style="color: var(--primary)"></i>
            Cadastrar Cliente
          </h3>
          <form id="formCliente">
            <label>Nome</label>
            <input
              type="text"
              id="clienteNome"
              required
              placeholder="Ex: João da Silva"
            />

            <label>Departamento</label>
            <input
              type="text"
              id="clienteDepartamento"
              placeholder="Ex: RH, TI, Vendas..."
            />

            <label>WhatsApp (com DDD)</label>
            <input
              type="tel"
              id="clienteWhatsapp"
              placeholder="Ex: 11999998888"
              required
            />

            <button
              type="submit"
              class="btn btn-primary"
              style="width: 100%; margin-top: 16px"
            >
              Salvar Cliente
            </button>
          </form>
        </div>

        <div class="card">
          <h3>
            <i class="ph ph-users" style="color: var(--primary)"></i> Clientes
          </h3>
          <div id="listaClientes">
            <div class="empty-state">
              <i class="ph ph-spinner-gap ph-spin"></i> Carregando...
            </div>
          </div>
        </div>
      </section>

      <!-- ABA SABORES -->
      <section id="tab-sabores" class="tab-content">
        <div class="card">
          <h3>
            <i class="ph ph-ice-cream" style="color: var(--primary)"></i>
            Cadastrar Sabor
          </h3>
          <form id="formSabor">
            <label>Nome do Sabor</label>
            <input
              type="text"
              id="saborNome"
              required
              placeholder="Ex: Morango, Chocolate..."
            />

            <label>Preço Unitário (R$)</label>
            <input
              type="number"
              id="saborPreco"
              step="0.01"
              min="0"
              required
              placeholder="0,00"
            />

            <button
              type="submit"
              class="btn btn-primary"
              style="width: 100%; margin-top: 16px"
            >
              Salvar Sabor
            </button>
          </form>
        </div>

        <div class="card">
          <h3>
            <i class="ph ph-list-dashes" style="color: var(--primary)"></i>
            Sabores e Preços
          </h3>
          <div id="listaSabores">
            <div class="empty-state">
              <i class="ph ph-spinner-gap ph-spin"></i> Carregando...
            </div>
          </div>
        </div>
      </section>

      <!-- ABA RELATÓRIOS -->
      <section id="tab-relatorios" class="tab-content">
        <div class="summary-grid">
          <div class="summary-card glass">
            <div class="label">Total Vendas</div>
            <div class="value value-blue" id="relTotalVendas">R$ 0,00</div>
          </div>
          <div class="summary-card glass">
            <div class="label">Recebido</div>
            <div class="value value-green" id="relFaturamento">R$ 0,00</div>
          </div>
          <div class="summary-card glass">
            <div class="label">Pendente</div>
            <div class="value value-red" id="relPendente">R$ 0,00</div>
          </div>
          <div class="summary-card glass">
            <div class="label">Pedidos</div>
            <div class="value" id="relQtdPedidos">0</div>
          </div>
        </div>

        <div class="card">
          <h3>
            <i class="ph ph-warning-circle" style="color: var(--danger)"></i>
            Devedores
          </h3>
          <div id="listaDevedores">
            <div class="empty-state">
              <i class="ph ph-spinner-gap ph-spin"></i> Carregando...
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="pedidos">
        <i class="ph ph-package"></i>Pedidos
      </button>
      <button class="nav-item" data-tab="clientes">
        <i class="ph ph-users"></i>Clientes
      </button>
      <button class="nav-item" data-tab="sabores">
        <i class="ph ph-ice-cream"></i>Sabores
      </button>
      <button class="nav-item" data-tab="relatorios">
        <i class="ph ph-chart-pie-slice"></i>Relatórios
      </button>
    </nav>

    <!-- MODAL NOVO PEDIDO -->
    <div class="modal-overlay" id="modalPedido">
      <div class="modal">
        <div class="modal-header">
          <h2>Novo Pedido</h2>
          <button class="close-btn" id="fecharModalPedido">
            <i class="ph ph-x"></i>
          </button>
        </div>

        <form id="formPedido">
          <label>Cliente</label>
          <select id="pedidoCliente" required></select>

          <label style="margin-top: 16px">Itens do Pedido</label>
          <div id="itensPedido"></div>
          <button
            type="button"
            class="btn btn-outline btn-sm"
            id="btnAddItem"
            style="margin-top: 8px"
          >
            <i class="ph ph-plus"></i> Adicionar Sabor
          </button>

          <div class="total-display">
            <span>Total:</span>
            <span id="pedidoTotal">R$ 0,00</span>
          </div>

          <div style="display: flex; gap: 12px">
            <div style="flex: 1">
              <label>Data</label>
              <input type="date" id="pedidoData" required />
            </div>
            <div style="flex: 1">
              <label>Status</label>
              <select id="pedidoStatus">
                <option value="pendente">Fiado (Pendente)</option>
                <option value="pago">Pago na hora</option>
              </select>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; margin-top: 24px; padding: 16px"
          >
            <i class="ph ph-check-circle"></i> Salvar Pedido
          </button>
        </form>
      </div>
    </div>

    <!-- MODAL EDITAR CLIENTE -->
    <div class="modal-overlay" id="modalEditarCliente">
      <div class="modal">
        <div class="modal-header">
          <h2>Editar Cliente</h2>
          <button type="button" class="close-btn" id="fecharModalEditarCliente">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <form id="formEditarCliente">
          <input type="hidden" id="editClienteId" />

          <label>Nome</label>
          <input type="text" id="editClienteNome" required />

          <label>Departamento</label>
          <input type="text" id="editClienteDepartamento" />

          <label>WhatsApp</label>
          <input type="tel" id="editClienteWhatsapp" required />

          <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; margin-top: 24px; padding: 16px"
          >
            <i class="ph ph-check-circle"></i> Salvar Alterações
          </button>
        </form>
      </div>
    </div>

    <!-- MODAL EDITAR SABOR -->
    <div class="modal-overlay" id="modalEditarSabor">
      <div class="modal">
        <div class="modal-header">
          <h2>Editar Sabor</h2>
          <button type="button" class="close-btn" id="fecharModalEditarSabor">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <form id="formEditarSabor">
          <input type="hidden" id="editSaborId" />

          <label>Nome do Sabor</label>
          <input type="text" id="editSaborNome" required />

          <label>Preço (R$)</label>
          <input
            type="number"
            id="editSaborPreco"
            step="0.01"
            min="0"
            required
          />

          <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; margin-top: 24px; padding: 16px"
          >
            <i class="ph ph-check-circle"></i> Salvar Alterações
          </button>
        </form>
      </div>
    </div>

    <!-- FIREBASE -->
    <script type="module">
      // 1. IMPORTS DO FIREBASE (Versão 10.12.0)
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getAuth,
        signInAnonymously,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        updateDoc,
        deleteDoc,
        doc,
        query,
        where,
        orderBy,
        Timestamp,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      // 2. CONFIGURAÇÃO DO PROJETO "GELADINHOS"
      const firebaseConfig = {
        apiKey: "AIzaSyC5qi5oDl5FtSY-m4AWoR2xawiMUzxBjcU",
        authDomain: "geladinhos-9655b.firebaseapp.com",
        projectId: "geladinhos-9655b",
        storageBucket: "geladinhos-9655b.firebasestorage.app",
        messagingSenderId: "335696413503",
        appId: "1:335696413503:web:4ab3911ce367f2216a098a",
        measurementId: "G-N8YEHRKNLH",
      };

      // 3. INICIALIZAÇÃO
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let clientes = [],
        sabores = [],
        pedidos = [],
        filtroStatus = "pendente";

      // TOAST NOTIFICATIONS
      function showToast(msg, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="ph ${
          type === "success" ? "ph-check-circle" : "ph-warning-circle"
        }" style="font-size:1.2rem;"></i> ${msg}`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.animation = "toastOut 0.3s forwards";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // AUTENTICAÇÃO
      onAuthStateChanged(auth, (user) => {
        if (user) {
          iniciarListeners();
        } else {
          signInAnonymously(auth).catch(() =>
            showToast("Erro de conexão com Firebase", "error")
          );
        }
      });

      // LISTENERS
      function iniciarListeners() {
        onSnapshot(
          query(collection(db, "clientes"), orderBy("nome")),
          (snap) => {
            clientes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderizarClientes();
            preencherSelectClientes();
          }
        );

        onSnapshot(
          query(collection(db, "sabores"), orderBy("nome")),
          (snap) => {
            sabores = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderizarSabores();
          }
        );

        onSnapshot(
          query(collection(db, "pedidos"), orderBy("data", "desc")),
          (snap) => {
            pedidos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderizarPedidos();
            atualizarRelatorios();
          }
        );
      }

      // NAVEGAÇÃO
      document.querySelectorAll(".nav-item").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".nav-item")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          document
            .querySelectorAll(".tab-content")
            .forEach((t) => t.classList.remove("active"));
          document
            .getElementById("tab-" + btn.dataset.tab)
            .classList.add("active");
        });
      });

      // --- CLIENTES ---
      document
        .getElementById("formCliente")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const nome = document.getElementById("clienteNome").value.trim();
          const departamento = document
            .getElementById("clienteDepartamento")
            .value.trim();
          const whatsapp = document
            .getElementById("clienteWhatsapp")
            .value.replace(/\D/g, "");

          try {
            await addDoc(collection(db, "clientes"), {
              nome,
              departamento,
              whatsapp,
              criadoEm: Timestamp.now(),
            });
            document.getElementById("formCliente").reset();
            showToast("Cliente cadastrado!");
          } catch (err) {
            showToast("Erro ao salvar.", "error");
          }
        });

      function renderizarClientes() {
        const container = document.getElementById("listaClientes");
        if (!clientes.length) {
          container.innerHTML =
            '<div class="empty-state"><i class="ph ph-users"></i> Nenhum cliente cadastrado.</div>';
          return;
        }
        container.innerHTML = clientes
          .map(
            (c) => `
        <div class="list-item">
          <div class="item-info">
            <div class="item-title">${c.nome}</div>
            <div class="item-sub">${c.departamento || "Sem depto"} · ${
              c.whatsapp
            }</div>
          </div>
          <div class="item-actions">
            <button class="btn btn-sm btn-outline btn-icon" onclick="editarCliente('${
              c.id
            }')"><i class="ph ph-pencil-simple"></i></button>
            <button class="btn btn-sm btn-outline btn-icon" style="color: var(--danger); border-color: rgba(255,59,48,0.2);" onclick="excluirCliente('${
              c.id
            }')"><i class="ph ph-trash"></i></button>
          </div>
        </div>
      `
          )
          .join("");
      }

      const modalEditarCliente = document.getElementById("modalEditarCliente");

      window.editarCliente = (id) => {
        const c = clientes.find((x) => x.id === id);
        if (!c) return;

        document.getElementById("editClienteId").value = c.id;
        document.getElementById("editClienteNome").value = c.nome;
        document.getElementById("editClienteDepartamento").value =
          c.departamento || "";
        document.getElementById("editClienteWhatsapp").value = c.whatsapp;

        modalEditarCliente.classList.add("show");
      };

      // Fechar modal de editar cliente
      document
        .getElementById("fecharModalEditarCliente")
        .addEventListener("click", () =>
          modalEditarCliente.classList.remove("show")
        );
      modalEditarCliente.addEventListener("click", (e) => {
        if (e.target === modalEditarCliente)
          modalEditarCliente.classList.remove("show");
      });

      // Salvar edição do cliente
      document
        .getElementById("formEditarCliente")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const id = document.getElementById("editClienteId").value;
          const nome = document.getElementById("editClienteNome").value.trim();
          const departamento = document
            .getElementById("editClienteDepartamento")
            .value.trim();
          const whatsapp = document
            .getElementById("editClienteWhatsapp")
            .value.replace(/\D/g, "");

          try {
            await updateDoc(doc(db, "clientes", id), {
              nome,
              departamento,
              whatsapp,
            });
            modalEditarCliente.classList.remove("show");
            showToast("Cliente atualizado!");
          } catch (error) {
            showToast("Erro ao atualizar cliente.", "error");
            console.error(error);
          }
        });

      window.excluirCliente = async (id) => {
        if (confirm("Excluir este cliente?")) {
          try {
            await deleteDoc(doc(db, "clientes", id));
            showToast("Cliente excluído.");
          } catch (error) {
            showToast("Erro ao excluir cliente.", "error");
            console.error(error);
          }
        }
      };

      // --- SABORES ---
      document
        .getElementById("formSabor")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const nome = document.getElementById("saborNome").value.trim();
          const preco = parseFloat(document.getElementById("saborPreco").value);

          try {
            await addDoc(collection(db, "sabores"), { nome, preco });
            document.getElementById("formSabor").reset();
            showToast("Sabor cadastrado!");
          } catch (err) {
            showToast("Erro ao salvar.", "error");
          }
        });

      function renderizarSabores() {
        const container = document.getElementById("listaSabores");
        if (!sabores.length) {
          container.innerHTML =
            '<div class="empty-state"><i class="ph ph-ice-cream"></i> Nenhum sabor cadastrado.</div>';
          return;
        }
        container.innerHTML = sabores
          .map(
            (s) => `
        <div class="list-item">
          <div class="item-info">
            <div class="item-title">${s.nome}</div>
            <div class="item-sub">R$ ${s.preco
              .toFixed(2)
              .replace(".", ",")}</div>
          </div>
          <div class="item-actions">
            <button class="btn btn-sm btn-outline btn-icon" onclick="editarSabor('${
              s.id
            }')"><i class="ph ph-pencil-simple"></i></button>
            <button class="btn btn-sm btn-outline btn-icon" style="color: var(--danger); border-color: rgba(255,59,48,0.2);" onclick="excluirSabor('${
              s.id
            }')"><i class="ph ph-trash"></i></button>
          </div>
        </div>
      `
          )
          .join("");
      }

      const modalEditarSabor = document.getElementById("modalEditarSabor");

      window.editarSabor = (id) => {
        const s = sabores.find((x) => x.id === id);
        if (!s) return;

        document.getElementById("editSaborId").value = s.id;
        document.getElementById("editSaborNome").value = s.nome;
        document.getElementById("editSaborPreco").value = s.preco;

        modalEditarSabor.classList.add("show");
      };

      // Fechar modal de editar sabor
      document
        .getElementById("fecharModalEditarSabor")
        .addEventListener("click", () =>
          modalEditarSabor.classList.remove("show")
        );
      modalEditarSabor.addEventListener("click", (e) => {
        if (e.target === modalEditarSabor)
          modalEditarSabor.classList.remove("show");
      });

      // Salvar edição do sabor
      document
        .getElementById("formEditarSabor")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const id = document.getElementById("editSaborId").value;
          const nome = document.getElementById("editSaborNome").value.trim();
          const preco = parseFloat(
            document.getElementById("editSaborPreco").value
          );

          try {
            await updateDoc(doc(db, "sabores", id), { nome, preco });
            modalEditarSabor.classList.remove("show");
            showToast("Sabor atualizado!");
          } catch (error) {
            showToast("Erro ao atualizar sabor.", "error");
            console.error(error);
          }
        });

      window.excluirSabor = async (id) => {
        if (confirm("Excluir este sabor?")) {
          try {
            await deleteDoc(doc(db, "sabores", id));
            showToast("Sabor excluído.");
          } catch (error) {
            showToast("Erro ao excluir sabor.", "error");
            console.error(error);
          }
        }
      };

      // --- PEDIDOS ---
      const modalPedido = document.getElementById("modalPedido");
      const itensPedidoDiv = document.getElementById("itensPedido");
      let itensTemp = [];

      document.getElementById("btnNovoPedido").addEventListener("click", () => {
        if (!clientes.length)
          return showToast("Cadastre um cliente primeiro.", "error");
        if (!sabores.length)
          return showToast("Cadastre um sabor primeiro.", "error");

        itensTemp = [{ saborId: "", quantidade: 1 }];
        renderizarItensTemp();
        document.getElementById("pedidoData").value = new Date()
          .toISOString()
          .split("T")[0];
        modalPedido.classList.add("show");
      });

      document
        .getElementById("fecharModalPedido")
        .addEventListener("click", () => modalPedido.classList.remove("show"));
      modalPedido.addEventListener("click", (e) => {
        if (e.target === modalPedido) modalPedido.classList.remove("show");
      });
      document.getElementById("btnAddItem").addEventListener("click", () => {
        itensTemp.push({ saborId: "", quantidade: 1 });
        renderizarItensTemp();
      });

      function renderizarItensTemp() {
        itensPedidoDiv.innerHTML = "";
        itensTemp.forEach((item, idx) => {
          const row = document.createElement("div");
          row.className = "item-row";

          const select = document.createElement("select");
          select.innerHTML =
            '<option value="">Selecione o sabor</option>' +
            sabores
              .map(
                (s) =>
                  `<option value="${s.id}" ${
                    s.id === item.saborId ? "selected" : ""
                  }>${s.nome} - R$ ${s.preco
                    .toFixed(2)
                    .replace(".", ",")}</option>`
              )
              .join("");
          select.addEventListener("change", (e) => {
            itensTemp[idx].saborId = e.target.value;
            calcularTotalTemp();
          });

          const qtdInput = document.createElement("input");
          qtdInput.type = "number";
          qtdInput.min = 1;
          qtdInput.value = item.quantidade;
          qtdInput.addEventListener("input", (e) => {
            itensTemp[idx].quantidade = Math.max(
              1,
              parseInt(e.target.value) || 1
            );
            calcularTotalTemp();
          });

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "btn btn-icon btn-outline";
          removeBtn.style.color = "var(--danger)";
          removeBtn.innerHTML = '<i class="ph ph-trash"></i>';
          removeBtn.addEventListener("click", () => {
            itensTemp.splice(idx, 1);
            renderizarItensTemp();
          });

          row.append(select, qtdInput, removeBtn);
          itensPedidoDiv.appendChild(row);
        });
        calcularTotalTemp();
      }

      function calcularTotalTemp() {
        let total = 0;
        itensTemp.forEach((item) => {
          const sabor = sabores.find((s) => s.id === item.saborId);
          if (sabor) total += sabor.preco * item.quantidade;
        });
        document.getElementById("pedidoTotal").textContent = `R$ ${total
          .toFixed(2)
          .replace(".", ",")}`;
        return total;
      }

      document
        .getElementById("formPedido")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const clienteId = document.getElementById("pedidoCliente").value;
          const dataStr = document.getElementById("pedidoData").value;
          const pago = document.getElementById("pedidoStatus").value === "pago";

          if (!clienteId) return showToast("Selecione um cliente.", "error");
          if (itensTemp.some((i) => !i.saborId))
            return showToast("Preencha todos os itens.", "error");

          const cliente = clientes.find((c) => c.id === clienteId);
          const itens = itensTemp.map((item) => {
            const sabor = sabores.find((s) => s.id === item.saborId);
            return {
              saborId: sabor.id,
              saborNome: sabor.nome,
              preco: sabor.preco,
              quantidade: item.quantidade,
            };
          });

          try {
            await addDoc(collection(db, "pedidos"), {
              clienteId,
              clienteNome: cliente.nome,
              clienteWhatsapp: cliente.whatsapp,
              itens,
              total: calcularTotalTemp(),
              pago,
              data: Timestamp.fromDate(new Date(dataStr + "T12:00:00")),
              dataPagamento: pago ? Timestamp.now() : null,
            });
            modalPedido.classList.remove("show");
            document.getElementById("formPedido").reset();
            showToast("Pedido salvo com sucesso!");
          } catch (err) {
            showToast("Erro ao salvar pedido.", "error");
          }
        });

      function preencherSelectClientes() {
        const select = document.getElementById("pedidoCliente");
        if (!select) return;
        select.innerHTML =
          '<option value="">Selecione o cliente</option>' +
          clientes
            .map((c) => `<option value="${c.id}">${c.nome}</option>`)
            .join("");
      }

      function renderizarPedidos() {
        const container = document.getElementById("listaPedidos");
        const filtrados =
          filtroStatus === "todos"
            ? pedidos
            : pedidos.filter((p) =>
                filtroStatus === "pago" ? p.pago : !p.pago
              );

        if (!filtrados.length) {
          container.innerHTML =
            '<div class="card empty-state"><i class="ph ph-receipt"></i> Nenhum pedido encontrado.</div>';
          return;
        }

        container.innerHTML = filtrados
          .map((p) => {
            const dataF = p.data?.toDate
              ? p.data.toDate().toLocaleDateString("pt-BR")
              : "—";
            const badge = p.pago
              ? '<span class="badge badge-pago">Pago</span>'
              : '<span class="badge badge-pendente">Pendente</span>';

            return `
          <div class="card" style="padding: 16px; margin-bottom: 12px;">
            <div class="flex-between mb-4">
              <div class="item-title">${p.clienteNome} ${badge}</div>
              <div style="font-weight: 700; color: var(--primary);">R$ ${p.total
                .toFixed(2)
                .replace(".", ",")}</div>
            </div>
            <div class="item-sub mb-4">${p.itens
              .map((i) => `${i.quantidade}x ${i.saborNome}`)
              .join(", ")} · ${dataF}</div>
            <div style="display: flex; gap: 8px;">
              ${
                !p.pago
                  ? `<button class="btn btn-sm btn-outline" style="flex:1; color:var(--success); border-color: rgba(52,199,89,0.3);" onclick="marcarPago('${p.id}')"><i class="ph ph-check"></i> Receber</button>`
                  : ""
              }
              <button class="btn btn-sm btn-primary" style="flex:1;" onclick="enviarWhatsApp('${
                p.id
              }')"><i class="ph ph-whatsapp-logo"></i> Recibo</button>
              <button class="btn btn-sm btn-outline btn-icon" style="color:var(--danger); border-color: rgba(255,59,48,0.2);" onclick="excluirPedido('${
                p.id
              }')"><i class="ph ph-trash"></i></button>
            </div>
          </div>
        `;
          })
          .join("");
      }

      document.querySelectorAll(".filtro-status").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filtro-status")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          filtroStatus = btn.dataset.status;
          renderizarPedidos();
        });
      });

      window.marcarPago = async (id) => {
        try {
          await updateDoc(doc(db, "pedidos", id), {
            pago: true,
            dataPagamento: Timestamp.now(),
          });
          showToast("Pagamento recebido!");
        } catch (error) {
          showToast("Erro ao marcar como pago.", "error");
          console.error(error);
        }
      };

      window.excluirPedido = async (id) => {
        if (confirm("Excluir este pedido?")) {
          try {
            await deleteDoc(doc(db, "pedidos", id));
            showToast("Pedido excluído.");
          } catch (error) {
            showToast("Erro ao excluir pedido.", "error");
            console.error(error);
          }
        }
      };

      // --- WHATSAPP ---
      window.enviarWhatsApp = (id) => {
        const p = pedidos.find((x) => x.id === id);
        const c = clientes.find((x) => x.id === p.clienteId);
        if (!c || !c.whatsapp)
          return showToast("Cliente sem WhatsApp.", "error");

        const num = c.whatsapp.replace(/\D/g, "");
        const dataF = p.data?.toDate
          ? p.data.toDate().toLocaleDateString("pt-BR")
          : "—";
        const status = p.pago ? "✅ *PAGO*" : "❌ *PENDENTE*";

        let msg = `🍦 *Recibo Geladinho*\n\n`;
        msg += `👤 *Cliente:* ${p.clienteNome}\n`;
        msg += `📅 *Data:* ${dataF}\n`;
        msg += `━━━━━━━━━━━━━━\n`;
        p.itens.forEach((i) => {
          msg += `▪️ ${i.quantidade}x ${i.saborNome} — R$ ${(
            i.preco * i.quantidade
          )
            .toFixed(2)
            .replace(".", ",")}\n`;
        });
        msg += `━━━━━━━━━━━━━━\n`;
        msg += `💰 *Total: R$ ${p.total.toFixed(2).replace(".", ",")}*\n`;
        msg += `📌 Status: ${status}\n\n`;
        msg += `_Obrigado pela preferência!_ 😊`;

        const url = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // --- RELATÓRIOS ---
      function atualizarRelatorios() {
        const total = pedidos.reduce((a, p) => a + p.total, 0);
        const pago = pedidos
          .filter((p) => p.pago)
          .reduce((a, p) => a + p.total, 0);
        const pend = pedidos
          .filter((p) => !p.pago)
          .reduce((a, p) => a + p.total, 0);

        document.getElementById("relTotalVendas").textContent = `R$ ${total
          .toFixed(2)
          .replace(".", ",")}`;
        document.getElementById("relFaturamento").textContent = `R$ ${pago
          .toFixed(2)
          .replace(".", ",")}`;
        document.getElementById("relPendente").textContent = `R$ ${pend
          .toFixed(2)
          .replace(".", ",")}`;
        document.getElementById("relQtdPedidos").textContent = pedidos.length;

        const devedoresMap = {};
        pedidos
          .filter((p) => !p.pago)
          .forEach((p) => {
            if (!devedoresMap[p.clienteId])
              devedoresMap[p.clienteId] = { nome: p.clienteNome, total: 0 };
            devedoresMap[p.clienteId].total += p.total;
          });

        const devs = Object.values(devedoresMap);
        const container = document.getElementById("listaDevedores");
        if (!devs.length) {
          container.innerHTML =
            '<div class="empty-state"><i class="ph ph-confetti"></i> Tudo pago! Nenhum devedor.</div>';
        } else {
          container.innerHTML = devs
            .map(
              (d) => `
          <div class="list-item">
            <div class="item-info">
              <div class="item-title">${d.nome}</div>
              <div class="item-sub">Valor pendente</div>
            </div>
            <div style="font-weight: 700; color: var(--danger);">R$ ${d.total
              .toFixed(2)
              .replace(".", ",")}</div>
          </div>
        `
            )
            .join("");
        }
      }
    </script>
  </body>
</html>
